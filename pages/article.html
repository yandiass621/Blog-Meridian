<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artigo | Meridian Blog</title>

    <link rel="stylesheet" href="../style/article.css">
</head>

<body>

    <header class="header">

        <div class="header-container">

            <div class="logo">
                <h1>Meridian</h1>
            </div>

            <nav class="navigation">
                <a href="home.html">Inicío</a>
                <a href="articles.html">Artigos</a>
            </nav>

        </div>
    </header>

    <main>

       <article>

            <div class="article-image-container">
                <img id="article-image" src="" alt="">
            </div>

            <span id="article-date" class="article-date"></span>

            <span id="article-category" class="article-category"></span>

            <h1 id="article-title"></h1>

            <div id="article-content"></div>

        </article>

        <section class="other-articles">

            <h2>Outros artigos</h2>

            <div id="other-articles-container" class="other-articles-container">
                <!-- Os cards serão adicionados pelo JavaScript -->
            </div>

        </section>

    </main>

    <script src="../script/article.js"></script>

</body>

</html>
